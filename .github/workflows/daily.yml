# 6단계: 매일 아침 8시(한국) 자동 실행 + 실패 시 메일
# GitHub 저장소 Settings > Secrets and variables > Actions 에 아래 4개를 등록해야 한다.
#   SARAMIN_ACCESS_KEY, GMAIL_USER, GMAIL_APP_PASSWORD, MAIL_TO
name: daily-job-alert

on:
  schedule:
    - cron: "0 23 * * *"     # UTC 23:00 = 한국 08:00
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write            # 누적 표(jobs_master)를 저장소에 다시 커밋하기 위해

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: 수집 → 적재 → 점검 → 정리 → 메일
        run: python run_all.py

      - name: 실패 알림 메일
        if: failure()
        run: python send_mail.py --fail

      - name: 누적 표·로그 커밋
        if: always()
        run: |
          git config user.name "job-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs_master.csv data/jobs_master.xlsx logs/ || true
          git commit -m "daily run $(date +%F)" || echo "변경 없음"
          git push
